<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title><!--NAME--> — <!--STYLE--></title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/restaurant.css">
</head>
<body>
<div class="page-frame">
<header class="dash-head">
  <div class="eyebrow"><!--STYLE--></div>
  <h1><!--NAME--></h1>
  <p class="sub"><!--TAGLINE--></p>
  <!--NAV-->
</header>
<div class="wrap">
  <div class="welcome">
    <p class="lede"><!--WELCOME--></p>
    <p class="welcome-sig"><!--WELCOME_SIG--></p>
  </div>

  <div class="ratings"><!--RATINGS--></div>

  <section class="resto-section menu">
    <h2 class="resto-h">Menu</h2>
    <!--MENU-->
  </section>

  <section class="resto-section">
    <h2 class="resto-h">Our story</h2>
    <p class="prose"><!--HISTORY--></p>
  </section>

  <section class="resto-section">
    <h2 class="resto-h">Our corner</h2>
    <p class="address"><!--ADDRESS--></p>
    <p class="prose"><!--LOCATION--></p>
  </section>

  <section class="resto-section">
    <h2 class="resto-h">The chef</h2>
    <!--CHEF-->
  </section>

  <section class="resto-section">
    <h2 class="resto-h">The team</h2>
    <!--TEAM-->
  </section>

  <section class="resto-section visit">
    <h2 class="resto-h">Visit us</h2>
    <div class="visit-grid">
      <div class="visit-col">
        <h3 class="visit-sub">Hours</h3>
        <!--HOURS-->
      </div>
      <div class="visit-col">
        <h3 class="visit-sub">Find us</h3>
        <p class="visit-line"><!--ADDRESS--></p>
      </div>
      <div class="visit-col">
        <h3 class="visit-sub">Reservations</h3>
        <p class="visit-line"><!--RESERVATION--></p>
        <p class="visit-phone"><!--PHONE--></p>
      </div>
    </div>
  </section>

  <footer class="resto-footer">
    <span class="foot-rule"></span>
    <span class="foot-heart">&#9829;</span>
    <span class="foot-rule"></span>
  </footer>
</div>
</div>
</body>
</html>
