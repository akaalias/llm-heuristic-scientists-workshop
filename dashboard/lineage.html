<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>Heuristic Discovery — Experiment Lineage</title>
<style>
/* Shares the dashboard's Tufte system. The lineage is a dependency-free inline
   SVG: experiments left→right in discovery order, y = total_lateness, arcs from
   each experiment to the parent(s) it built on. */
:root{
  --paper:#fffff8; --ink:#111111; --muted:#6b6a60; --faint:#9b998c;
  --rule:#d9d5c3; --rule-soft:#ece9da; --accent:#8c2f1f; --ochre:#8a6a1e; --disc:#b9b6a6;
  --serif:"Palatino","Palatino Linotype","Book Antiqua","URW Palladio L",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html{background:var(--paper);}
body{margin:0;background:var(--paper);color:var(--ink);
     font:18px/1.6 var(--serif);font-feature-settings:"onum" 1,"liga" 1;
     -webkit-font-smoothing:antialiased;}

.dash-head{max-width:66.67vw;margin:0 auto;padding:48px 0 6px;}
.eyebrow{font:italic 16px/1 var(--serif);color:var(--accent);letter-spacing:.01em;margin-bottom:13px;}
.dash-head h1{font-weight:400;font-size:34px;line-height:1.12;letter-spacing:-.01em;margin:0 0 8px;}
.dash-head .sub{color:var(--muted);font-style:italic;font-size:18px;margin:0 0 10px;max-width:64ch;}
.nav{font-size:15px;margin:0 0 14px;}
.nav a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;}
.nav a:hover{border-bottom-color:var(--accent);}
.nav a:not(:last-child)::after{content:" · ";color:var(--faint);border:0;}

.legend{max-width:66.67vw;margin:10px auto 4px;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px;color:var(--muted);}
.legend .k{display:inline-flex;align-items:center;gap:7px;}
.legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.legend .dot.kept{background:var(--ink);} .legend .dot.disc{background:var(--disc);}
.legend .dot.fail{background:var(--accent);}
.legend .arc{width:18px;height:9px;border-top:1px solid var(--rule);display:inline-block;
             border-radius:9px 9px 0 0;}
/* full-bleed diagram: breaks out of the reading column to the viewport,
   scrolls sideways when there are many experiments */
#diagram{overflow-x:auto;border-top:1px solid var(--rule);margin-top:14px;
         padding:24px 28px 16px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
#diagram::-webkit-scrollbar{height:6px;}
#diagram::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px;}

/* lineage svg — natural px width so it can exceed the viewport and scroll */
#lin{display:block;}
#lin text{font:12px/1 var(--serif);fill:var(--muted);}
#lin .edge{fill:none;stroke:var(--rule);stroke-width:1;}
#lin .nd{cursor:pointer;}
#lin .nk{fill:var(--ink);}
#lin .ndd{fill:var(--disc);}
#lin .nf{fill:var(--accent);}
#lin .nlab{fill:var(--faint);font:10px/1 var(--serif);font-variant-numeric:lining-nums;}
#lin .hit{cursor:pointer;}
/* dim everything, then re-light the hovered bloodline (order: lit wins) */
#lin.dim .nd,#lin.dim .edge,#lin.dim .nlab{opacity:.14;}
#lin.dim .nd.lit,#lin.dim .nlab.lit{opacity:1;}
#lin.dim .edge.lit{opacity:1;stroke:var(--ink);stroke-width:1.4;}

.empty{padding:28px 0;color:var(--muted);font-style:italic;}

/* hover tooltip */
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .08s;
     background:var(--paper);color:var(--ink);border:1px solid var(--rule);
     box-shadow:0 4px 18px rgba(60,50,30,.15);border-radius:4px;
     font:13px/1.45 var(--serif);padding:8px 11px;max-width:340px;}
#tip .tt-title{font-weight:700;margin-bottom:2px;}
#tip .tt-meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
#tip .tt-rule{color:#33312b;font-style:italic;font-size:12.5px;margin-top:5px;
              border-top:1px solid var(--rule-soft);padding-top:5px;}
</style>
</head>
<body>
<header class="dash-head">
  <div class="eyebrow">LLM Heuristic Scientists · experiment lineage</div>
  <h1>Experiment lineage</h1>
  <p class="sub"><!--SUB--></p>
  <div class="nav"><a href="/">&larr; Dashboard</a><a href="/grid">Schedule grid</a></div>
  <div class="legend">
    <span class="k"><span class="dot kept"></span>Kept (new best)</span>
    <span class="k"><span class="dot disc"></span>Worse than best</span>
    <span class="k"><span class="dot fail"></span>Failed</span>
    <span class="k"><span class="arc"></span>Derived from its parent</span>
  </div>
</header>
<div id="diagram"></div>

<div id="tip"></div>
<script id="lineage-data" type="application/json"><!--LINEAGEDATA--></script>
<script>
(function () {
  let data = {};
  try { data = JSON.parse(document.getElementById("lineage-data").textContent || "{}"); } catch (e) {}
  const nodes = data.nodes || [];
  const host = document.getElementById("diagram");
  const tip = document.getElementById("tip");
  if (!host) return;
  if (!nodes.length) { host.innerHTML = '<p class="empty">No experiments yet — run discovery.</p>'; return; }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (t) => Number.isInteger(t) ? String(t) : t.toFixed(1);
  const xMark = (x, y, r) => `M${x-r},${y-r}L${x+r},${y+r}M${x+r},${y-r}L${x-r},${y+r}`;
  function niceTicks(min, max, c){ if (max <= min) max = min + 1;
    const raw = (max-min)/Math.max(1,c-1), mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1,2,5,10].map(m => m*mag).find(s => s >= raw); const out = [];
    for (let v = Math.ceil(min/step)*step; v <= max+1e-9; v += step) out.push(Math.round(v*1000)/1000);
    return out; }

  // adjacency
  const byKey = {}; nodes.forEach(n => byKey[n.key] = n);
  const childrenOf = {}; nodes.forEach(n => childrenOf[n.key] = []);
  const parentsOf  = {}; nodes.forEach(n => parentsOf[n.key] = (n.parents || []).filter(p => byKey[p]));
  nodes.forEach(n => parentsOf[n.key].forEach(p => childrenOf[p].push(n.key)));
  const walk = (k, nbr, acc) => { (nbr[k] || []).forEach(x => { if (!acc.has(x)) { acc.add(x); walk(x, nbr, acc); } }); return acc; };

  // full-bleed arc diagram: experiments on one baseline (discovery order),
  // fixed node spacing (so it scrolls sideways with many), semicircular arcs
  // above linking each to its parent(s).
  const n = nodes.length;
  const padX = 28, topPad = 14, CAP = 260, minSpacing = 26;
  const labelOf = (nd) => nd.symbol || ("#" + nd.n);
  const maxLabelLen = Math.max(1, ...nodes.map(nd => labelOf(nd).length));
  const labelH = Math.min(280, Math.round(maxLabelLen * 5.9) + 14);   // room for the vertical labels
  const avail = Math.max(320, (host.clientWidth || 1000) - 2 * padX - 8);
  const spacing = n > 1 ? Math.max(minSpacing, avail / (n - 1)) : 0;
  const Wpx = Math.round(2 * padX + (n - 1) * spacing);
  const xFor = (i) => padX + i * spacing;
  const xOf = {}; nodes.forEach((nd, i) => xOf[nd.key] = xFor(i));

  const edges = [];
  nodes.forEach(nd => parentsOf[nd.key].forEach(pk =>
    edges.push({ c: nd.key, p: pk, dx: Math.abs(xOf[nd.key] - xOf[pk]) })));
  const maxRy = edges.length ? Math.min(CAP, Math.max(...edges.map(e => e.dx / 2))) : 18;
  const baseY = topPad + maxRy;
  const H = Math.ceil(baseY + 12 + labelH);

  let g = "";
  // arcs above the row (capped half-ellipse for very long-range links); no baseline
  edges.forEach(e => {
    const a = Math.min(xOf[e.p], xOf[e.c]), b = Math.max(xOf[e.p], xOf[e.c]);
    const rx = (b - a) / 2, ry = Math.min(CAP, rx);
    g += `<path class="edge" data-c="${esc(e.c)}" data-p="${esc(e.p)}" `
       + `d="M${a.toFixed(1)},${baseY} A${rx.toFixed(1)},${ry.toFixed(1)} 0 0 1 ${b.toFixed(1)},${baseY}"/>`;
  });
  nodes.forEach((nd, i) => {
    const x = xFor(i).toFixed(1);
    const cls = nd.kind === "failed" ? "nf" : nd.kind === "kept" ? "nk" : "ndd";
    const r = nd.kind === "kept" ? 4 : 3;
    g += `<circle class="nd ${cls}" data-key="${esc(nd.key)}" cx="${x}" cy="${baseY}" r="${r}"/>`;
    g += `<circle class="hit" data-key="${esc(nd.key)}" cx="${x}" cy="${baseY}" r="9" fill="transparent"/>`;
    // label reads top→bottom (rotate 90, anchored just below the node)
    g += `<text class="nlab" data-key="${esc(nd.key)}" x="${x}" y="${baseY + 8}" text-anchor="start" `
       + `transform="rotate(90 ${x} ${baseY + 8})">${esc(labelOf(nd))}</text>`;
  });
  host.innerHTML = `<svg id="lin" width="${Wpx}" height="${H}" viewBox="0 0 ${Wpx} ${H}">${g}</svg>`;

  // interaction: hover a node → light its whole bloodline; click → dashboard
  const svg = document.getElementById("lin");
  const q = (k) => CSS.escape(k);
  function lit(key){
    const set = new Set([key]); walk(key, parentsOf, set);   // ancestors only, back to the root
    svg.classList.add("dim");
    svg.querySelectorAll(".lit").forEach(el => el.classList.remove("lit"));
    set.forEach(k => svg.querySelectorAll(`[data-key="${q(k)}"]`).forEach(el => el.classList.add("lit")));
    svg.querySelectorAll(".edge").forEach(e => {
      if (set.has(e.getAttribute("data-c")) && set.has(e.getAttribute("data-p"))) e.classList.add("lit");
    });
  }
  function unlit(){ svg.classList.remove("dim"); svg.querySelectorAll(".lit").forEach(el => el.classList.remove("lit")); }

  svg.addEventListener("mouseover", e => { const m = e.target.closest("[data-key]"); if (m) lit(m.getAttribute("data-key")); });
  svg.addEventListener("mouseout",  e => { const m = e.target.closest("[data-key]"); if (m){ unlit(); tip.style.opacity = "0"; } });
  svg.addEventListener("mousemove", e => {
    const m = e.target.closest("[data-key]"); if (!m){ tip.style.opacity = "0"; return; }
    const nd = byKey[m.getAttribute("data-key")]; if (!nd) return;
    const lat = nd.lateness != null ? `lateness ${fmt(nd.lateness)}` : "failed";
    tip.innerHTML = `<div class="tt-title">${esc(nd.title)}</div>`
      + `<div class="tt-meta">#${esc(nd.n)} · ${lat}</div>`
      + (nd.summary ? `<div class="tt-rule">${esc(nd.summary)}</div>` : "");
    tip.style.left = (e.clientX + 13) + "px";
    tip.style.top  = (e.clientY + 15) + "px";
    tip.style.opacity = "1";
  });
  svg.addEventListener("click", e => { const m = e.target.closest("[data-key]");
    if (m) location.href = "/#exp=" + encodeURIComponent(m.getAttribute("data-key")); });
})();
</script>
</body>
</html>
