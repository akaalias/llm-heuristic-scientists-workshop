<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>Heuristic Discovery — Run Log</title>
<style>
/* ============================================================================
   Tufte-style run log + live chart. Cream paper, near-black ink, one rust
   accent, Palatino serif, old-style figures, thin rules instead of boxes —
   small-caps tags and ink left-rules instead of coloured pills. Adapted from
   the FMDiscovery dashboard's shared visual system.
   ========================================================================== */
:root{
  --paper:#fffff8;        /* Tufte cream            */
  --ink:#111111;          /* near-black body text   */
  --muted:#6b6a60;        /* warm gray — secondary  */
  --faint:#9b998c;        /* fainter — captions     */
  --rule:#d9d5c3;         /* warm hairline          */
  --rule-soft:#ece9da;    /* fainter hairline       */
  --accent:#8c2f1f;       /* ET rust-red, sparingly */
  --ochre:#8a6a1e;        /* secondary data tint    */
  --disc:#b9b6a6;         /* discarded marks        */
  --serif:"Palatino","Palatino Linotype","Book Antiqua","URW Palladio L",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html{background:var(--paper);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:18px/1.6 var(--serif);
  font-feature-settings:"onum" 1,"liga" 1;   /* old-style figures, ligatures */
  -webkit-font-smoothing:antialiased;
}

/* ---- header ------------------------------------------------------------- */
.dash-head{max-width:66.67vw;margin:0 auto;padding:48px 0 6px;}
.eyebrow{font:italic 16px/1 var(--serif);color:var(--accent);letter-spacing:.01em;margin-bottom:13px;}
.dash-head h1{font-weight:400;font-size:34px;line-height:1.12;letter-spacing:-.01em;margin:0 0 8px;}
.dash-head .sub{color:var(--muted);font-style:italic;font-size:18px;margin:0 0 10px;}
.dash-head .nav{font-size:15px;margin:0 0 14px;}
.dash-head .nav a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;}
.dash-head .nav a:hover{border-bottom-color:var(--accent);}
.dash-head .nav a:not(:last-child)::after{content:" · ";color:var(--faint);border:0;}
.dash-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;font-size:14px;color:var(--muted);}
.dash-meta .k{display:inline-flex;align-items:center;gap:7px;}
.dash-meta .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dash-meta .dot.kept{background:var(--ink);}
.dash-meta .dot.disc{background:var(--disc);}
.dash-meta .x{color:var(--accent);font-weight:700;line-height:1;}
.dash-meta .bar{width:16px;height:0;border-top:2px solid var(--ink);display:inline-block;}
.dash-meta .bar.dash{border-top:2px dashed var(--accent);}
.dash-meta .ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ochre);display:inline-block;}
/* pivot row: an ochre left-rule (a deliberate change of direction) */
.pivot-row{box-shadow:inset 3px 0 0 var(--ochre);}
#updated{color:var(--faint);font-style:italic;margin-left:auto;}
#live{font-size:13px;}
#live.on{color:#3f6e6e;}
#live.on::before{content:"● ";animation:pulse 2s ease-in-out infinite;}
#live.off{color:var(--faint);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ---- the live chart — inline SVG, no libraries -------------------------- */
.dash-wrap{max-width:66.67vw;margin:0 auto;padding:4px 0 64px;}
.chart-card{border-top:1px solid var(--rule);padding:16px 0 4px;margin-top:18px;}
#chart{width:100%;height:auto;display:block;}
#chart text{font:13px/1 var(--serif);fill:var(--muted);font-feature-settings:"onum" 1;}
#chart .grid{stroke:var(--rule-soft);stroke-width:1;}
#chart .axis{stroke:var(--ink);stroke-width:1;}
#chart .bestline{fill:none;stroke:var(--ink);stroke-width:1.6;}
#chart .pt-kept{fill:var(--ink);}
#chart .pt-disc{fill:var(--disc);opacity:.6;}
#chart .pt-failed{stroke:var(--accent);stroke-width:1.6;fill:none;}
#chart .pt-pivot{fill:none;stroke:var(--ochre);stroke-width:1.5;}   /* ring = pivot (new approach) */
#chart .target{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 4;opacity:.85;}
#chart .hit{cursor:pointer;}
#chart .dot.hi{stroke:var(--ink);stroke-width:1.5;}      /* hovered from chart   */
#chart .dot.sel{stroke:var(--accent);stroke-width:2.2;}  /* clicked / selected   */
/* a freshly-arrived dot grows in from its own centre (opacity untouched, so
   discarded dots keep their faintness) */
@keyframes dotIn{from{transform:scale(0);}to{transform:scale(1);}}
#chart .dot.appear{transform-box:fill-box;transform-origin:center;
                   animation:dotIn .45s cubic-bezier(.2,.8,.3,1.25);}
#chart .tlab{fill:var(--accent);font-style:italic;}
#chart .xlab{fill:var(--faint);font-feature-settings:"smcp" 1;text-transform:uppercase;letter-spacing:.05em;}
.chart-empty{color:var(--muted);font-style:italic;padding:34px 0;}

/* ---- the run table — Tufte data table ----------------------------------- */
.tbl-card{border-top:1.5px solid var(--ink);margin-top:26px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14.5px;}
th,td{text-align:left;padding:9px 14px 9px 0;vertical-align:top;}
thead th:first-child,tbody td:first-child{text-align:right;padding-right:18px;white-space:nowrap;}
th{font:600 12px/1.2 var(--serif);font-feature-settings:"smcp" 1;
   text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
   border-bottom:1.5px solid var(--ink);white-space:nowrap;}
td{border-bottom:1px solid var(--rule-soft);}
tbody tr:hover{background:#f7f3e3;}

/* numbers: lining tabular figures so columns align */
.num{font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;}
.best{font-weight:700;}                       /* lowest-lateness row so far   */
.best-row{box-shadow:inset 2px 0 0 var(--ink);}   /* ink left-rule = running best */
.mono{font:12.5px/1.4 var(--mono);color:var(--muted);}
.faint{color:var(--faint);}

/* small-caps status tags — one restrained tint each, no coloured pills */
.status{font:600 11.5px/1 var(--serif);font-feature-settings:"smcp" 1;
        text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.st-ok{color:var(--ink);}
.st-bad{color:var(--accent);}

.empty{padding:28px 0;color:var(--muted);font-style:italic;}

/* a new row slid in by the live stream gets a brief warm highlight */
@keyframes rowflash{0%,25%{background:#f0e2c4;}100%{background:transparent;}}
.row-new td{animation:rowflash 2.2s ease-out;}

/* cross-highlight from the chart: hovered (transient) and selected (sticky) */
.row-hi{background:#f0e2c4;}
.row-selected{background:#f6ecdc;box-shadow:inset 3px 0 0 var(--accent);}

/* ---- click-to-expand experiment detail ---------------------------------- */
tr.row{cursor:pointer;}
tr.expanded{background:#f4efe0;}
tr.detail-row > td{background:#fcfbf2;border-bottom:1.5px solid var(--ink);padding:0;
                    text-align:left;white-space:normal;}  /* reset the #-column's nowrap */

/* a constrained two-column layout: a quiet meta/lineage rail + a measured
   content column. The content column is capped (minmax 0 68ch) so prose has a
   readable measure and the code scrolls within it instead of stretching the
   table. */
/* 1/3 meta rail | 2/3 content, via flex with a *definite* width (the page
   column). min-width:0 on the content side is what lets long text wrap and the
   code scroll within its column instead of stretching the table. */
.detail-inner{display:flex;gap:36px;width:66.67vw;box-sizing:border-box;
              padding:24px 30px 30px;align-items:flex-start;}
.d-meta{flex:0 0 31%;}
.d-main{flex:1 1 0;min-width:0;}
@media(max-width:920px){.detail-inner{flex-direction:column;width:auto;gap:18px;}
                        .d-meta{flex-basis:auto;}}

/* meta rail */
.d-meta{display:flex;flex-direction:column;gap:18px;}
.d-symbol{font:12px/1.4 var(--mono);color:var(--ink);background:#efe9d8;
          padding:5px 9px;border-radius:3px;align-self:flex-start;
          overflow-wrap:anywhere;max-width:100%;}
.d-facts{display:flex;flex-direction:column;gap:5px;font-size:13px;}
.d-fact{display:flex;justify-content:space-between;gap:12px;line-height:1.3;}
.d-k{font:600 11px/1.3 var(--serif);font-feature-settings:"smcp" 1;text-transform:uppercase;
     letter-spacing:.05em;color:var(--muted);}
.d-v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;}
.d-v.bad{color:var(--accent);}

.d-lineage-h{font:600 11px/1.3 var(--serif);font-feature-settings:"smcp" 1;text-transform:uppercase;
             letter-spacing:.06em;color:var(--faint);margin-bottom:7px;
             padding-bottom:6px;border-bottom:1px solid var(--rule-soft);}
.d-parent{display:block;width:fit-content;max-width:100%;color:var(--accent);cursor:pointer;
          font:600 11.5px/1.4 var(--serif);font-feature-settings:"smcp" 1;text-transform:uppercase;
          letter-spacing:.03em;border-bottom:1px solid transparent;margin-bottom:4px;
          overflow-wrap:anywhere;}
.d-parent:hover{border-bottom-color:var(--accent);}
.d-parent .pn{color:var(--muted);font-weight:400;}
.d-genesis{font-style:italic;color:var(--faint);font-size:13px;}

/* content column */
.d-title{font:600 22px/1.22 var(--serif);color:var(--ink);margin:0 0 10px;letter-spacing:-.006em;}
.d-rule-h,.d-code-h{font:600 11px/1.3 var(--serif);font-feature-settings:"smcp" 1;text-transform:uppercase;
          letter-spacing:.06em;color:var(--faint);margin:0 0 7px;}
.d-rule-h{margin-top:2px;}
.d-summary{font:italic 17px/1.5 var(--serif);color:#33312b;margin:0 0 22px;max-width:70ch;}
.d-code-h{margin-top:0;}
.d-loading{color:var(--muted);font-style:italic;margin:0;}

/* code block + minimal python highlighting */
pre.code{font:12.5px/1.62 var(--mono);background:#fbfaf2;border-left:2px solid var(--rule);
         padding:13px 16px;margin:0;white-space:pre;overflow-x:auto;color:#33312b;border-radius:0 2px 2px 0;}
pre.code .k{color:var(--accent);}                   /* keywords */
pre.code .s{color:var(--ochre);}                    /* strings  */
pre.code .c{color:var(--faint);font-style:italic;}  /* comments */
pre.code .n{color:#3f6e6e;}                         /* numbers  */

/* schedule Gantt (inline SVG) */
.d-cap{font:italic 12px/1.4 var(--serif);color:var(--faint);margin:0 0 8px;}
svg.gantt{width:100%;height:auto;display:block;margin:0 0 22px;}
svg.gantt text{font:11px/1 var(--serif);fill:var(--muted);}
svg.gantt .gg{stroke:var(--rule-soft);stroke-width:1;}
svg.gantt .ga{stroke:var(--ink);stroke-width:1;}
svg.gantt .gy{font-feature-settings:"smcp" 1;text-transform:uppercase;letter-spacing:.03em;}
svg.gantt .gx{fill:var(--faint);}
svg.gantt .gd{fill:#33312b;font:10px/1 var(--mono);pointer-events:none;}  /* dish # — ink on pale fill */
svg.gantt rect[data-tip]:hover{filter:brightness(0.9);}                   /* slightly darker on hover */

/* popover for schedule bars: a dark ink chip, cream text, anchored centred
   just above the hovered bar (positioned by JS from the bar's box) */
#gtip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .08s;
      transform:translate(-50%,-100%);white-space:nowrap;text-align:center;
      background:var(--ink);color:var(--paper);font:12px/1.35 var(--serif);
      padding:5px 9px;border-radius:2px;}
</style>
</head>
<body>
<header class="dash-head">
  <div class="eyebrow">LLM Heuristic Scientists · run log</div>
  <h1>Heuristic discovery progress</h1>
  <p class="sub"><!--SUB--></p>
  <div class="nav"><a href="/grid">Schedule grid</a><a href="/lineage">Experiment lineage</a></div>
  <div class="dash-meta">
    <span class="k"><span class="dot kept"></span>Best so far</span>
    <span class="k"><span class="dot disc"></span>Worse than best</span>
    <span class="k"><span class="x">&times;</span>Failed</span>
    <span class="k"><span class="bar"></span>Running best</span>
    <span class="k"><span class="bar dash"></span>Target</span>
    <span class="k"><span class="ring"></span>Pivot (new approach)</span>
    <span id="updated"><!--UPDATED--></span>
    <span id="live" class="off"></span>
  </div>
</header>
<div class="dash-wrap">
  <div class="chart-card">
    <svg id="chart" viewBox="0 0 1000 288" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="total lateness per experiment over time"></svg>
  </div>
  <div class="tbl-card">
    <!--TABLE-->
  </div>
</div>

<div id="gtip"></div>
<script id="chart-data" type="application/json"><!--CHARTDATA--></script>
<script>
// ============================================================================
// Live updates via Server-Sent Events, plus a hand-rolled inline-SVG chart.
// Progressive enhancement: the table is server-rendered, so it shows current
// state with JS disabled; the chart + live stream are pure enhancement.
// ============================================================================

// ---- chart geometry & helpers ---------------------------------------------
const VB = {W:1000, H:288, L:68, R:20, T:14, B:30};
const chartSeen = new Set();   // keys already drawn — so only new dots animate in

function niceNum(range, round){
  const exp = Math.floor(Math.log10(range || 1));
  const f = (range || 1) / Math.pow(10, exp);
  const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)
                   : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
  return nf * Math.pow(10, exp);
}
function niceTicks(min, max, count){
  if (max <= min) max = min + 1;
  const step = niceNum((max - min) / Math.max(1, count - 1), true);
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step)
    out.push(Math.round(v * 1000) / 1000);
  return out;
}
const fmt = (t) => Number.isInteger(t) ? String(t) : t.toFixed(1);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function xMark(x, y, r){ return `M${x-r},${y-r}L${x+r},${y+r}M${x+r},${y-r}L${x-r},${y+r}`; }

function renderChart(points, target, animate){
  const svg = document.getElementById("chart");
  if (!svg) return;
  points = points || [];
  const {W,H,L,R,T,B} = VB, x0=L, x1=W-R, y0=T, y1=H-B;

  if (!points.length){
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="chart-empty">`
                  + `no experiments yet</text>`;
    return;
  }

  const tgt  = (typeof target === "number") ? target : 0;
  const succ = points.filter(p => p.y != null).map(p => p.y);
  const lo   = Math.min(0, tgt);
  const hi   = Math.max(succ.length ? Math.max(...succ) : 1, tgt);
  const span = (hi - lo) || 1;
  const dmin = lo - span * 0.08;   // headroom so 0 / target / best lift off the axis
  const dmax = hi + span * 0.10;
  const n = points.length;
  const xFor = (i) => n <= 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * i / (n - 1);
  const yFor = (v) => y1 - (v - dmin) / (dmax - dmin) * (y1 - y0);

  let g = "";
  // horizontal gridlines + y labels (skip the one that coincides with the
  // target — its own dashed line + label already carries that value)
  for (const t of niceTicks(lo, hi, 4)){
    if (Math.abs(t - tgt) < span * 1e-3) continue;
    const y = yFor(t);
    g += `<line class="grid" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`
       + `<text x="${x0-9}" y="${y+4}" text-anchor="end">${fmt(t)}</text>`;
  }
  // axes
  g += `<line class="axis" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}"/>`
     + `<line class="axis" x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}"/>`;
  // (the target threshold is drawn LAST, below, so it sits on top of the
  //  best line and dots instead of being painted over by them)
  // running-best step line (carried forward across discarded/failed)
  let best = null; const bp = [];
  points.forEach((p, i) => {
    if (p.y != null) best = (best == null) ? p.y : Math.min(best, p.y);
    if (best != null) bp.push([xFor(i), yFor(best)]);
  });
  if (bp.length){
    const R = 6;   // corner radius for the step joints
    let d = `M${bp[0][0].toFixed(1)},${bp[0][1].toFixed(1)}`;
    for (let i = 1; i < bp.length; i++){
      const px = bp[i-1][0], py = bp[i-1][1], cx = bp[i][0], cy = bp[i][1];
      const dy = cy - py;
      const r = Math.min(R, (cx - px) / 2, Math.abs(dy) / 2);
      if (dy === 0 || r < 0.5){
        d += `H${cx.toFixed(1)}`;                 // flat run — no corner
        if (dy !== 0) d += `V${cy.toFixed(1)}`;
      } else {
        const sy = Math.sign(dy);                 // round the H→V joint with a quadratic fillet
        d += `H${(cx - r).toFixed(1)}`
           + `Q${cx.toFixed(1)},${py.toFixed(1)} ${cx.toFixed(1)},${(py + sy * r).toFixed(1)}`
           + `V${cy.toFixed(1)}`;
      }
    }
    g += `<path class="bestline" d="${d}"/>`;
  }
  // points: kept (ink), discarded (faint), failed (rust × pinned to the top =
  // worst). Each carries its row's data-key and a generous transparent hit
  // circle so it's easy to hover/click despite the small visible mark.
  points.forEach((p, i) => {
    const x = xFor(i);
    const y = (p.y != null) ? yFor(p.y) : y0 + 6;
    const k = esc(p.key || "");
    const appear = (animate && p.key && !chartSeen.has(p.key)) ? " appear" : "";
    if (p.kind === "failed")
      g += `<path class="pt-failed dot${appear}" data-key="${k}" d="${xMark(x, y, 3.5)}"/>`;
    else if (p.kind === "kept")
      g += `<circle class="pt-kept dot${appear}" data-key="${k}" cx="${x}" cy="${y}" r="4"/>`;
    else
      g += `<circle class="pt-disc dot${appear}" data-key="${k}" cx="${x}" cy="${y}" r="2.6"/>`;
    if (p.pivot) g += `<circle class="pt-pivot" cx="${x}" cy="${y}" r="7"/>`;   // pivot ring
    g += `<circle class="hit" data-key="${k}" cx="${x}" cy="${y}" r="10" fill="transparent"/>`;
  });
  // remember what we've drawn, so only genuinely-new dots animate next time
  points.forEach(p => { if (p.key) chartSeen.add(p.key); });
  // axis captions
  const ymid = (y0 + y1) / 2;
  g += `<text class="xlab" x="${(x0+x1)/2}" y="${H-7}" text-anchor="middle">experiment →</text>`
     + `<text class="xlab" x="16" y="${ymid}" text-anchor="middle" `
     + `transform="rotate(-90 16 ${ymid})">total lateness</text>`;

  // target threshold — line drawn LAST so it sits on top of the best line and
  // dots; its label sits to the LEFT of the y-axis (like a tick label at the
  // target's level) so it never covers recent points near the right edge.
  const yt = yFor(tgt);
  g += `<line class="target" x1="${x0}" y1="${yt}" x2="${x1}" y2="${yt}"/>`
     + `<text class="tlab" x="${x0 - 9}" y="${yt + 4}" text-anchor="end">target ${fmt(tgt)}</text>`;

  svg.innerHTML = g;
}

// ---- live wiring + interaction --------------------------------------------
(function () {
  const chart = document.getElementById("chart");
  const tbody = document.getElementById("rows");
  const sub   = document.querySelector(".sub");
  const upd   = document.getElementById("updated");
  const live  = document.getElementById("live");

  // cross-highlight + sticky selection between a chart dot and its table row.
  let selectedKey = null;
  const rowEl = (k) => tbody && tbody.querySelector(`tr[data-key="${CSS.escape(k)}"]`);
  const dotEl = (k) => chart && chart.querySelector(`.dot[data-key="${CSS.escape(k)}"]`);

  function setHover(k, on){
    const r = rowEl(k); if (r) r.classList.toggle("row-hi", on);
    const d = dotEl(k); if (d) d.classList.toggle("hi", on);
  }
  function applySelection(){     // re-assert the sticky selection after a re-render
    chart && chart.querySelectorAll(".dot.sel").forEach(d => d.classList.remove("sel"));
    tbody && tbody.querySelectorAll(".row-selected").forEach(r => r.classList.remove("row-selected"));
    if (!selectedKey) return;
    const d = dotEl(selectedKey); if (d) d.classList.add("sel");
    const r = rowEl(selectedKey); if (r) r.classList.add("row-selected");
  }
  function select(k){
    selectedKey = k;
    applySelection();
    const r = rowEl(k);
    if (r) r.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  if (chart){
    chart.addEventListener("mouseover", e => { const m = e.target.closest("[data-key]"); if (m) setHover(m.dataset.key, true);  });
    chart.addEventListener("mouseout",  e => { const m = e.target.closest("[data-key]"); if (m) setHover(m.dataset.key, false); });
    chart.addEventListener("click",     e => { const m = e.target.closest("[data-key]"); if (m) select(m.dataset.key); });
  }

  // popover over schedule (Gantt) bars — anchored centred above the hovered bar
  const gtip = document.getElementById("gtip");
  if (gtip){
    document.addEventListener("mouseover", e => {
      const bar = e.target.closest && e.target.closest("svg.gantt rect[data-tip]");
      if (!bar) return;
      const r = bar.getBoundingClientRect();
      gtip.textContent = bar.getAttribute("data-tip");
      gtip.style.left = (r.left + r.width / 2) + "px";
      gtip.style.top  = (r.top - 8) + "px";        // sits just above the bar
      gtip.style.opacity = "1";
    });
    document.addEventListener("mouseout", e => {
      if (e.target.closest && e.target.closest("svg.gantt rect[data-tip]")) gtip.style.opacity = "0";
    });
  }

  // ---- click-to-expand experiment detail ----------------------------------
  const detailCache = {};       // key → built HTML (null = fetch in flight)
  let expandedKey = null;

  function buildDetail(d){
    const failed = (d.status || "").startsWith("failed");
    const time = (d.time || "").includes("T") ? d.time.split("T")[1] : (d.time || "—");
    const lateness = failed ? "failed" : (d.lateness || "—");

    const lineage = (d.parents && d.parents.length)
      ? (d.parents || []).map(p =>
          `<span class="d-parent" data-key="${esc(p.key)}" title="${esc(p.title)}">`
          + `↳ ${esc(p.symbol)} <span class="pn">#${esc(p.n)}</span></span>`).join("")
      : `<div class="d-genesis">genesis — no parent</div>`;

    const meta =
      `<aside class="d-meta">`
      + `<div class="d-symbol">${esc(d.symbol)}</div>`
      + `<div class="d-facts">`
      +   `<div class="d-fact"><span class="d-k">Experiment</span><span class="d-v">#${esc(d.n)}</span></div>`
      +   `<div class="d-fact"><span class="d-k">Lateness</span><span class="d-v${failed ? " bad" : ""}">${esc(lateness)}</span></div>`
      +   `<div class="d-fact"><span class="d-k">Time</span><span class="d-v">${esc(time)}</span></div>`
      + `</div>`
      + `<div class="d-lineage"><div class="d-lineage-h">Derived from</div>${lineage}</div>`
      + `</aside>`;

    const main =
      `<div class="d-main">`
      + `<h3 class="d-title">${esc(d.title)}</h3>`
      + (d.summary
          ? `<div class="d-rule-h">Priority rule</div><p class="d-summary">${esc(d.summary)}</p>`
          : "")
      + (d.gantt_svg                                                   // already HTML (inline SVG)
          ? `<div class="d-code-h">Schedule</div>`
            + `<div class="d-cap">colour = order · number = dish · dotted = arrival · dashed = due</div>`
            + d.gantt_svg
          : "")
      + (d.code_html
          ? `<div class="d-code-h">Heuristic</div><pre class="code">${d.code_html}</pre>`  // already HTML
          : `<p class="d-loading">no code saved</p>`)
      + `</div>`;

    return `<div class="detail-inner">${meta}${main}</div>`;
  }
  function collapseDetail(){
    document.querySelectorAll("#rows tr.detail-row").forEach(d => d.remove());
    document.querySelectorAll("#rows tr.expanded").forEach(r => r.classList.remove("expanded"));
  }
  function insertDetail(key){
    collapseDetail();
    const row = rowEl(key);
    if (!row) return;
    row.classList.add("expanded");
    const n = document.querySelectorAll("table thead th").length || 7;
    const tr = document.createElement("tr");
    tr.className = "detail-row";
    tr.innerHTML = `<td colspan="${n}">${detailCache[key]
        || '<div class="detail-inner"><p class="d-loading">loading…</p></div>'}</td>`;
    row.after(tr);
  }
  async function openDetail(key, scroll){
    expandedKey = key;
    insertDetail(key);
    if (scroll){ const r = rowEl(key); if (r) r.scrollIntoView({ behavior: "smooth", block: "center" }); }
    if (detailCache[key] === undefined){
      detailCache[key] = null;   // in flight — don't double-fetch
      try {
        const res = await fetch("detail?key=" + encodeURIComponent(key));
        detailCache[key] = res.ok ? buildDetail(await res.json())
          : '<div class="detail-inner"><p class="d-loading">not found</p></div>';
      } catch (e) {
        detailCache[key] = '<div class="detail-inner"><p class="d-loading">failed to load</p></div>';
      }
      if (expandedKey === key) insertDetail(key);   // swap loading → content if still open
    }
  }
  function toggleDetail(key){
    if (expandedKey === key){ expandedKey = null; collapseDetail(); return; }
    openDetail(key, false);
  }
  function reapplyExpansion(){ if (expandedKey) insertDetail(expandedKey); }

  if (tbody){
    tbody.addEventListener("click", e => {
      const pb = e.target.closest(".d-parent");
      if (pb && pb.dataset.key){ openDetail(pb.dataset.key, true); return; }
      const tr = e.target.closest("tr.row");
      if (tr && tr.dataset.key) toggleDetail(tr.dataset.key);
    });
  }

  // initial render from the data embedded by the server (works even if SSE fails)
  let init = {};
  try { init = JSON.parse(document.getElementById("chart-data").textContent || "{}"); } catch (e) {}
  renderChart(init.points, init.target, false);   // seed existing dots without animating
  applySelection();

  // deep link from the schedule grid: /#exp=<key> opens that experiment
  const deep = location.hash.match(/exp=([^&]+)/);
  if (deep) { try { openDetail(decodeURIComponent(deep[1]), true); } catch (e) {} }

  // live stream
  if (!tbody || !window.EventSource) return;
  const keysOf = () =>
    new Set([...tbody.querySelectorAll("tr[data-key]")].map(r => r.dataset.key));
  let known = keysOf();

  const es = new EventSource("events");
  es.onopen  = () => { live.textContent = "live";          live.className = "on";  };
  es.onerror = () => { live.textContent = "reconnecting…"; live.className = "off"; };
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    tbody.innerHTML = d.rows;
    if (sub) sub.textContent = d.sub;
    if (upd) upd.textContent = d.updated;
    renderChart(d.chart, d.target, true);   // animate only the newly-arrived dots
    // flash only rows we hadn't seen before (the new experiments)
    tbody.querySelectorAll("tr[data-key]").forEach(r => {
      if (!known.has(r.dataset.key)) r.classList.add("row-new");
    });
    known = keysOf();
    applySelection();      // the live re-render wiped class state — re-apply selection
    reapplyExpansion();    // …and re-open the detail panel if one was expanded
  };
})();
</script>
</body>
</html>
