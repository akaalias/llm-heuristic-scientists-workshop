<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>Heuristic Discovery — Run Log</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/index.css">
</head>
<body>
<header class="dash-head">
  <div class="eyebrow">LLM Heuristic Scientists · run log</div>
  <h1>Heuristic discovery progress</h1>
  <p class="sub"><!--SUB--></p>
  <div class="nav"><a href="/">&larr; The restaurant</a><a href="/grid">Schedule grid</a><a href="/lineage">Experiment lineage</a></div>
  <div class="dash-meta">
    <span class="k"><span class="dot kept"></span>Best so far</span>
    <span class="k"><span class="dot disc"></span>Worse than best</span>
    <span class="k"><span class="x">&times;</span>Failed</span>
    <span class="k"><span class="bar"></span>Running best</span>
    <span class="k"><span class="bar dash"></span>Target</span>
    <span class="k"><span class="ring"></span>Pivot (new approach)</span>
    <span id="updated"><!--UPDATED--></span>
    <span id="live" class="off"></span>
  </div>
</header>
<div class="dash-wrap">
  <div class="chart-card">
    <svg id="chart" viewBox="0 0 1000 288" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="total lateness per experiment over time"></svg>
  </div>
  <div class="tbl-card">
    <!--TABLE-->
  </div>
</div>

<div id="gtip"></div>
<script id="chart-data" type="application/json"><!--CHARTDATA--></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
